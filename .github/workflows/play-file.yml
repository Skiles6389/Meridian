name: Rebuild play files

on:
  push:
    branches: [main]
    paths-ignore:
      - play/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: play-file
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build:single

      # Pushes made with GITHUB_TOKEN do not trigger further workflow runs, so this cannot loop.
      # play/meridian.html keeps the pre-rename name so existing links still work.
      - name: Commit play/dogfight.html and play/meridian.html if they changed
        run: |
          mkdir -p play
          cp dist-single/dogfight.html play/dogfight.html
          cp dist-single/dogfight.html play/meridian.html
          if [ -z "$(git status --porcelain -- play)" ]; then
            echo "play files are up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add play/dogfight.html play/meridian.html
          git commit -m "Rebuild play files"
          git pull --rebase origin main
          git push origin HEAD:main
